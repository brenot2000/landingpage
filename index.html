<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Breno Santos - Links</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #010f06;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 20px;
      overflow: hidden;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 10%, rgba(0, 200, 80, 0.22) 0%, transparent 60%),
        radial-gradient(ellipse 70% 50% at 80% 90%, rgba(0, 255, 120, 0.18) 0%, transparent 60%),
        radial-gradient(ellipse 60% 70% at 60% 30%, rgba(50, 180, 0, 0.12) 0%, transparent 55%);
      animation: auroraPulse 10s ease-in-out infinite alternate;
      z-index: 0;
      pointer-events: none;
    }

    @keyframes auroraPulse {
      0%   { opacity: 1; transform: scale(1) rotate(0deg); }
      50%  { opacity: 0.75; transform: scale(1.05) rotate(1deg); }
      100% { opacity: 1; transform: scale(0.97) rotate(-1deg); }
    }

    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.35;
      z-index: 0;
      pointer-events: none;
      animation: orbFloat linear infinite;
    }

    .orb-1 {
      width: 420px; height: 420px;
      background: radial-gradient(circle, #00c850, transparent 70%);
      top: -120px; left: -100px;
      animation-duration: 18s;
    }
    .orb-2 {
      width: 360px; height: 360px;
      background: radial-gradient(circle, #00ff78, transparent 70%);
      bottom: -80px; right: -80px;
      animation-duration: 22s;
      animation-delay: -7s;
    }
    .orb-3 {
      width: 280px; height: 280px;
      background: radial-gradient(circle, #32b400, transparent 70%);
      top: 40%; left: 60%;
      animation-duration: 26s;
      animation-delay: -13s;
    }

    @keyframes orbFloat {
      0%   { transform: translate(0, 0) scale(1); }
      25%  { transform: translate(30px, -40px) scale(1.06); }
      50%  { transform: translate(-20px, 30px) scale(0.95); }
      75%  { transform: translate(40px, 20px) scale(1.03); }
      100% { transform: translate(0, 0) scale(1); }
    }

    .stars {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .stars::before,
    .stars::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(1px 1px at 10% 15%, rgba(255,255,255,0.7) 0%, transparent 100%),
        radial-gradient(1px 1px at 25% 42%, rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 40% 8%, rgba(255,255,255,0.8) 0%, transparent 100%),
        radial-gradient(1px 1px at 55% 65%, rgba(255,255,255,0.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 70% 20%, rgba(255,255,255,0.6) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 82% 55%, rgba(255,255,255,0.7) 0%, transparent 100%),
        radial-gradient(1px 1px at 90% 80%, rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(1px 1px at 15% 75%, rgba(255,255,255,0.6) 0%, transparent 100%),
        radial-gradient(1px 1px at 60% 90%, rgba(255,255,255,0.4) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 35% 60%, rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(1px 1px at 78% 35%, rgba(255,255,255,0.6) 0%, transparent 100%),
        radial-gradient(1px 1px at 48% 48%, rgba(255,255,255,0.3) 0%, transparent 100%);
      animation: starsTwinkle 6s ease-in-out infinite alternate;
    }

    .stars::after {
      background-image:
        radial-gradient(1px 1px at 5% 50%, rgba(255,255,255,0.6) 0%, transparent 100%),
        radial-gradient(1px 1px at 20% 85%, rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 33% 28%, rgba(255,255,255,0.7) 0%, transparent 100%),
        radial-gradient(1px 1px at 65% 72%, rgba(255,255,255,0.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 88% 12%, rgba(255,255,255,0.6) 0%, transparent 100%),
        radial-gradient(1px 1px at 95% 60%, rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 50% 25%, rgba(180,140,255,0.6) 0%, transparent 100%),
        radial-gradient(1px 1px at 72% 88%, rgba(140,200,255,0.5) 0%, transparent 100%);
      animation-delay: -3s;
      animation-duration: 8s;
    }

    @keyframes starsTwinkle {
      0%   { opacity: 0.6; }
      100% { opacity: 1; }
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 480px;
      position: relative;
      z-index: 1;
    }

    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: linear-gradient(135deg, #7f00ff, #e100ff);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      margin-bottom: 16px;
      box-shadow: 0 0 24px rgba(127, 0, 255, 0.5);
    }

    h1 {
      color: #ffffff;
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }

    .subtitle {
      color: #b0a8d0;
      font-size: 0.9rem;
      margin-bottom: 36px;
      text-align: center;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
    }

    a.link-btn {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 20px;
      border-radius: 14px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
      color: #ffffff;
    }

    a.link-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }

    .btn-instagram {
      background: linear-gradient(90deg, #833ab4, #fd1d1d, #fcb045);
    }

    .btn-site {
      background: linear-gradient(90deg, #1a1a2e, #16213e);
      border: 1px solid rgba(127, 0, 255, 0.5);
    }

    .icon {
      width: 26px;
      height: 26px;
      flex-shrink: 0;
      fill: #ffffff;
    }

    .footer {
      margin-top: 40px;
      color: #5c5480;
      font-size: 0.75rem;
    }
  </style>
</head>
<body>
  <div class="stars"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  <div class="container">
    <div class="avatar">🤖</div>
    <h1>Breno Santos</h1>
    <p class="subtitle">Negócios com Agentes de IA</p>

    <div class="links">

      <a class="link-btn btn-instagram"
         href="https://instagram.com/brenosantos.ia"
         target="_blank"
         rel="noopener noreferrer">
        <svg class="icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/>
        </svg>
        @brenosantos.ia
      </a>

      <a class="link-btn btn-site"
         href="https://negociocomagentesdeia.com"
         target="_blank"
         rel="noopener noreferrer">
        <svg class="icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm-1 21.945V18h2v3.945A10.025 10.025 0 0112 22a10.03 10.03 0 01-1-.055zM11 16v-4H7l5-8v4h4l-5 8z"/>
        </svg>
        negociocomagentesdeia.com
      </a>

    </div>

    <p class="footer">© 2026 Breno Santos</p>
  </div>
</body>
</html>
